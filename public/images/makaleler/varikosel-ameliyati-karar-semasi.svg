<svg width="1400" height="1880" viewBox="0 0 1400 1880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="120" y1="80" x2="1260" y2="1800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FCFB"/>
      <stop offset="0.52" stop-color="#F2F8F6"/>
      <stop offset="1" stop-color="#EDF5F1"/>
    </linearGradient>
    <linearGradient id="hero" x1="100" y1="100" x2="1300" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B5D56"/>
      <stop offset="1" stop-color="#118A6B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFF4EC"/>
      <stop offset="1" stop-color="#BEE7D6"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style>
      .eyebrow { font: 700 20px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #D6FAE7; }
      .title { font: 700 46px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .subtitle { font: 400 23px 'Segoe UI', Arial, sans-serif; fill: #E6FFF4; }
      .section { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #102A2A; }
      .body { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #1F2937; }
      .small { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #5B6B73; }
      .mini { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #6B7C85; letter-spacing: 1px; }
      .yes { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0B6B4B; }
      .no { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #A12626; }
      .footer { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #64748B; }
    </style>
  </defs>

  <rect width="1400" height="1880" rx="32" fill="url(#pageBg)"/>

  <circle cx="1220" cy="120" r="150" fill="url(#accent)" opacity="0.55"/>
  <circle cx="180" cy="1640" r="180" fill="url(#accent)" opacity="0.35"/>

  <rect x="88" y="86" width="1224" height="218" rx="36" fill="url(#hero)" filter="url(#cardShadow)"/>
  <text x="140" y="145" class="eyebrow">DOC. DR. SENAI AKSOY • HASTA REHBERI</text>
  <text x="140" y="208" class="title">Varikosel Ameliyatı Ne Zaman Gerekir?</text>
  <text x="140" y="252" class="subtitle">Muayene, sperm testi ve gebelik planı birlikte değerlendirilmelidir.</text>

  <rect x="104" y="340" width="1192" height="86" rx="24" fill="#FFFFFF" stroke="#D8E9E2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="700" y="393" text-anchor="middle" class="body">Karar tek bir ultrason raporuna göre değil, klinik tabloya göre verilir.</text>

  <rect x="350" y="488" width="700" height="126" rx="30" fill="#FFFFFF" stroke="#CFE4DB" stroke-width="3" filter="url(#cardShadow)"/>
  <text x="700" y="535" text-anchor="middle" class="mini">ADIM 1</text>
  <text x="700" y="578" text-anchor="middle" class="section">Muayenede belirgin varikosel var mı?</text>

  <path d="M700 614V702" stroke="#93A9A3" stroke-width="8" stroke-linecap="round"/>
  <path d="M662 670L700 712L738 670" stroke="#93A9A3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="116" y="734" width="446" height="210" rx="30" fill="#FFF4F4" stroke="#F3B2B2" stroke-width="3" filter="url(#cardShadow)"/>
  <text x="339" y="790" text-anchor="middle" class="no">HAYIR</text>
  <text x="339" y="838" text-anchor="middle" class="section">Sadece ultrasonda görülen</text>
  <text x="339" y="876" text-anchor="middle" class="section">subklinik varikosel</text>
  <text x="339" y="920" text-anchor="middle" class="small">Çoğu durumda ameliyat önerilmez.</text>

  <rect x="838" y="734" width="446" height="210" rx="30" fill="#F1FCF6" stroke="#A9E2BF" stroke-width="3" filter="url(#cardShadow)"/>
  <text x="1061" y="790" text-anchor="middle" class="yes">EVET</text>
  <text x="1061" y="838" text-anchor="middle" class="section">Klinik varikosel var</text>
  <text x="1061" y="876" text-anchor="middle" class="section">Bir sonraki adıma geçilir</text>
  <text x="1061" y="920" text-anchor="middle" class="small">Sıradaki soru sperm testidir.</text>

  <path d="M1061 944V1028" stroke="#93A9A3" stroke-width="8" stroke-linecap="round"/>
  <path d="M1023 997L1061 1039L1099 997" stroke="#93A9A3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="711" y="1062" width="700" height="126" rx="30" fill="#FFFFFF" stroke="#CFE4DB" stroke-width="3" filter="url(#cardShadow)"/>
  <text x="1061" y="1109" text-anchor="middle" class="mini">ADIM 2</text>
  <text x="1061" y="1152" text-anchor="middle" class="section">Semen analizinde bozulma var mı?</text>

  <path d="M1061 1188V1274" stroke="#93A9A3" stroke-width="8" stroke-linecap="round"/>
  <path d="M1023 1242L1061 1286L1099 1242" stroke="#93A9A3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="711" y="1308" width="304" height="214" rx="30" fill="#FFF4F4" stroke="#F3B2B2" stroke-width="3" filter="url(#cardShadow)"/>
  <text x="863" y="1368" text-anchor="middle" class="no">HAYIR</text>
  <text x="863" y="1414" text-anchor="middle" class="section">Sperm testi normalse</text>
  <text x="863" y="1458" text-anchor="middle" class="small">Çoğu hastada izlem,</text>
  <text x="863" y="1488" text-anchor="middle" class="small">ameliyattan daha uygundur.</text>

  <rect x="1099" y="1308" width="304" height="214" rx="30" fill="#F1FCF6" stroke="#A9E2BF" stroke-width="3" filter="url(#cardShadow)"/>
  <text x="1251" y="1368" text-anchor="middle" class="yes">EVET</text>
  <text x="1251" y="1414" text-anchor="middle" class="section">Sperm testinde</text>
  <text x="1251" y="1450" text-anchor="middle" class="section">bozulma var</text>
  <text x="1251" y="1490" text-anchor="middle" class="small">Gebelik planı ile birlikte</text>
  <text x="1251" y="1518" text-anchor="middle" class="small">değerlendirilir.</text>

  <path d="M1251 1522V1604" stroke="#93A9A3" stroke-width="8" stroke-linecap="round"/>
  <path d="M1213 1574L1251 1616L1289 1574" stroke="#93A9A3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="812" y="1636" width="598" height="126" rx="30" fill="#FFFFFF" stroke="#CFE4DB" stroke-width="3" filter="url(#cardShadow)"/>
  <text x="1111" y="1683" text-anchor="middle" class="mini">ADIM 3</text>
  <text x="1111" y="1726" text-anchor="middle" class="section">Çift gebelik istiyor mu ve süreç uzadı mı?</text>

  <rect x="92" y="1578" width="560" height="228" rx="30" fill="#FFFBEA" stroke="#F2D37C" stroke-width="3" filter="url(#cardShadow)"/>
  <text x="372" y="1640" text-anchor="middle" class="section">Ameliyat dışı yol daha uygun olabilir</text>
  <text x="372" y="1690" text-anchor="middle" class="body">İzlem, tekrar semen analizi, üroloji</text>
  <text x="372" y="1726" text-anchor="middle" class="body">değerlendirmesi veya doğrudan</text>
  <text x="372" y="1762" text-anchor="middle" class="body">yardımcı üreme planı düşünülebilir.</text>

  <rect x="760" y="1784" width="562" height="76" rx="22" fill="#DCF6E7" stroke="#7FD0A0" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1041" y="1832" text-anchor="middle" class="section">Ameliyat anlamlı olabilir</text>

  <text x="92" y="1840" class="footer">Not: Nihai karar; muayene, semen analizi, kadın partnerin yaşı, over rezervi ve çiftin tüm üreme planı birlikte değerlendirilerek verilir.</text>
</svg>
